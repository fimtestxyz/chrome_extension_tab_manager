<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Workspace Manager</title>
  <style>
    body {
      width: 320px;
      min-height: 200px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #f8f9fa;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .header svg {
      color: #4285f4;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-card {
      padding: 12px;
      background: white;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #dadce0;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #4285f4;
    }

    .stat-label {
      font-size: 12px;
      color: #5f6368;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #4285f4;
      color: white;
    }

    .btn-primary:hover {
      background: #3367d6;
    }

    .btn-secondary {
      background: white;
      color: #202124;
      border: 1px solid #dadce0;
    }

    .btn-secondary:hover {
      background: #f1f3f4;
    }

    .divider {
      height: 1px;
      background: #dadce0;
      margin: 12px 0;
    }

    .link {
      text-align: center;
      margin-top: 12px;
    }

    .link a {
      color: #4285f4;
      text-decoration: none;
      font-size: 13px;
    }

    .link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7" rx="1"></rect>
      <rect x="14" y="3" width="7" height="7" rx="1"></rect>
      <rect x="3" y="14" width="7" height="7" rx="1"></rect>
      <rect x="14" y="14" width="7" height="7" rx="1"></rect>
    </svg>
    <h1>Tab Workspaces</h1>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="tabCount">0</div>
      <div class="stat-label">Open Tabs</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="workspaceCount">0</div>
      <div class="stat-label">Workspaces</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="openSidePanelBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="9" y1="3" x2="9" y2="21"></line>
      </svg>
      Open Workspace Manager
    </button>
    <button class="btn btn-secondary" id="saveWorkspaceBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
        <polyline points="17 21 17 13 7 13 7 21"></polyline>
        <polyline points="7 3 7 8 15 8"></polyline>
      </svg>
      Save Current Tabs
    </button>
    <button class="btn btn-secondary" id="autoGroupBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
      </svg>
      Auto-Group by Domain
    </button>
  </div>

  <div class="divider"></div>

  <div class="link">
    <a href="#" id="keyboardShortcuts">⌨️ Keyboard Shortcuts</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>

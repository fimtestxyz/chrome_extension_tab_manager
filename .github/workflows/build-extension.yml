name: Build Chrome Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Extension Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies (for icon generation)
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate icons (if needed)
        run: |
          if [ ! -f assets/icons/icon-128.png ]; then
            echo "Generating icons..."
            python generate_icons.py
          else
            echo "Icons already exist"
          fi

      - name: Build extension
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[0-9.]*"' manifest.json | sed 's/.*"\([0-9.]*\)".*/\1/')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="v${VERSION}-$(date +%Y%m%d)"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Extension version: $VERSION"
          echo "Release tag: $TAG"

      - name: Versioned ZIP for Chrome Web Store
        run: |
          ZIP_NAME="tab-workspace-manager-${{ steps.version.outputs.tag }}.zip"
          if [ -f tab-workspace-manager-v*.zip ]; then
            mv tab-workspace-manager-v*.zip "$ZIP_NAME"
          elif [ -f tab-workspace-manager.zip ]; then
            mv tab-workspace-manager.zip "$ZIP_NAME"
          else
            cd build && zip -r "../$ZIP_NAME" . -x "*.DS_Store" "*.git*"
          fi
          echo "📦 Created $ZIP_NAME"

      - name: Build CRX package
        run: |
          chmod +x generate-crx.js
          node generate-crx.js "${{ steps.version.outputs.tag }}"

      - name: Generate update manifest
        run: |
          cat > update-manifest.xml <<EOF
          <?xml version='1.0' encoding='UTF-8'?>
          <gupdate xmlns='http://www.google.com/update2/response' protocol='2.0'>
            <app appid='YOUR_EXTENSION_ID_HERE'>
              <updatecheck codebase='https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/tab-workspace-manager-${{ steps.version.outputs.tag }}.zip' version='${{ steps.version.outputs.version }}' />
            </app>
          </gupdate>
          EOF

      - name: Generate checksums
        run: |
          sha256sum tab-workspace-manager-*.zip tab-workspace-manager-*.crx > checksums.sha256
          cat checksums.sha256
          echo ""
          echo "📦 Built files:"
          ls -lh tab-workspace-manager-* checksums.sha256 update-manifest.xml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-${{ steps.version.outputs.tag }}
          path: |
            tab-workspace-manager-*.zip
            tab-workspace-manager-*.crx
            checksums.sha256
            update-manifest.xml
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            tab-workspace-manager-*.zip
            tab-workspace-manager-*.crx
            checksums.sha256
            update-manifest.xml
          body: |
            ## Release ${{ steps.version.outputs.tag }}

            ### 📦 Downloads

            | File | Use Case |
            |------|----------|
            | `tab-workspace-manager-${{ steps.version.outputs.tag }}.zip` | Chrome Web Store upload |
            | `tab-workspace-manager-crx-${{ steps.version.outputs.tag }}.crx` | Direct install (drag to `chrome://extensions/`) |
            | `checksums.sha256` | Verify file integrity |
            | `update-manifest.xml` | Auto-update configuration |

            ### 🚀 Installation

            **Chrome Web Store (recommended):**
            1. Upload the `.zip` to [Developer Dashboard](https://chrome.google.com/webstore/devconsole)

            **Direct CRX install:**
            1. Download the `.crx` file
            2. Open Chrome → `chrome://extensions/`
            3. Enable **Developer Mode** (top right)
            4. Drag the `.crx` file onto the page

            **Local dev:**
            1. Download the `.zip` and extract
            2. Load as unpacked extension in `chrome://extensions/`

            ### 🔐 Verify
            ```bash
            sha256sum -c checksums.sha256
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "# ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| File | Purpose |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`tab-workspace-manager-${{ steps.version.outputs.tag }}.zip\` | Chrome Web Store |" >> $GITHUB_STEP_SUMMARY
          echo "| \`tab-workspace-manager-crx-${{ steps.version.outputs.tag }}.crx\` | Direct install |" >> $GITHUB_STEP_SUMMARY
          echo "| \`checksums.sha256\` | Integrity check |" >> $GITHUB_STEP_SUMMARY